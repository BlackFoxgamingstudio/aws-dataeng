[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-aws-dataeng"
version = "1.0.0"
description = "AWS enterprise data lake and ETL pipeline SDK. Manages AWS Glue job definitions, Athena schema catalogs, S3 partitioned data lakes, and EMR Spark jobs for big data analytics without vendor lock-in."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "cloud data engineering & etl", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-aws-dataeng = "src.cli:main"
