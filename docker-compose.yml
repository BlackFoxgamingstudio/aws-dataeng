version: "3.9"
# Sovereign AWS DataEng — docker-compose
# Usage: docker-compose up --build

services:
  aws-dataeng:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-aws-dataeng:latest
    container_name: sovereign-aws-dataeng
    restart: unless-stopped
    ports:
      - "8801:8801"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      SBB_S3_BUCKET: ${SBB_S3_BUCKET}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8801
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8801/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
